<!--
  Text-to-shaberi 配信字幕オーバーレイ — VTuber風 切り替わりプリセット
  ================================================================

  index.html（既定フェード式）との違い:
    - フェードしない — 表示も消去も瞬時（カット）
    - 発話に同期: 鳴り始めで表示し、発話が終わった瞬間に消える（途切れたら残らない）
    - テキスト変更は瞬時。切替時に軽い pop アニメ（--pop-ms: 0 で無効化）
    - 任意の背景ボックス（--box-bg に色を入れると角丸パネル表示）
    - HOLD（下の script）を true にすると、発話が途切れても直近の行を保持（消えない）

  使い方:
    client.toml で [caption].template = "vtuber" を指定。
    OBS ブラウザソースの URL は http://127.0.0.1:8772/（GET / がこのプリセットを返す）

  CSS 変数一覧:
    --font          フォント
    --size          文字サイズ
    --color         文字色
    --stroke-color  縁取り色
    --stroke-width  縁取り太さ
    --shadow        text-shadow
    --align         水平位置 (center / left / right)
    --valign        垂直位置 (flex-end / center / flex-start)
    --max-width     字幕最大幅
    --pop-ms        切替 pop アニメ時間（0 で無効）
    --box-bg        背景ボックス色（transparent で非表示）
    --box-radius    背景ボックス角丸
    --box-pad       背景ボックス内余白
-->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root {
    --font: "Noto Sans JP", sans-serif;
    --size: 64px;
    --color: #ffffff;
    --stroke-color: #000000;
    --stroke-width: 6px;
    --shadow: 0 0 8px rgba(0,0,0,.8);
    --align: center;
    --valign: flex-end;
    --max-width: 90vw;
    --pop-ms: 120ms;
    --box-bg: transparent;
    --box-radius: 12px;
    --box-pad: .15em .5em;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    height: 100%;
    align-items: var(--valign);
    justify-content: var(--align);
  }
  #cap {
    font-family: var(--font);
    font-size: var(--size);
    color: var(--color);
    -webkit-text-stroke: var(--stroke-width) var(--stroke-color);
    paint-order: stroke fill;
    text-shadow: var(--shadow);
    max-width: var(--max-width);
    line-height: 1.3;
    padding: var(--box-pad);
    background: var(--box-bg);
    border-radius: var(--box-radius);
    white-space: pre-wrap;
    word-break: break-word;
    opacity: 0;            /* 既定は隠す。テキストが来たら .on で即表示（transition なし＝カット） */
  }
  #cap.on { opacity: 1; }
  @keyframes pop {
    from { transform: scale(.96) translateY(4px); }
    to   { transform: scale(1) translateY(0); }
  }
  #cap.pop {
    animation: pop var(--pop-ms) ease-out;
  }
</style>
</head>
<body>
<div id="wrap"><div id="cap"></div></div>
<script>
  // HOLD = true にすると、発話が途切れても直近の行を保持（消えない）。
  // 既定 false = 発話が終わった瞬間に消す。
  var HOLD = false;

  var cap = document.getElementById('cap');
  var lastSeq = -1;
  var current = '';

  function show(text) {
    cap.textContent = text;
    cap.classList.add('on');
    cap.classList.remove('pop');
    void cap.offsetWidth;       // reflow して pop アニメを毎回再生
    cap.classList.add('pop');
  }

  function hide() {
    cap.classList.remove('on');
    cap.classList.remove('pop');
    cap.textContent = '';
    current = '';
  }

  function apply(m) {
    if (typeof m.seq === 'number' && m.seq < lastSeq) return;
    lastSeq = m.seq ?? lastSeq;
    if (m.visible && m.text) {
      if (m.text !== current) {   // 同じ文の連続更新では pop し直さない
        current = m.text;
        show(m.text);
      }
    } else if (!m.visible && !HOLD) {
      hide();                     // 発話終了(visible:false)で瞬時に消す
    }
    // 空テキストの show は無視（text-stream の AudioBegin 直後の一瞬の空表示を防ぐ）
  }

  function connect() {
    var url = (location.protocol === 'https:' ? 'wss://' : 'ws://')
      + location.host + '/ws' + location.search;
    var ws = new WebSocket(url);
    ws.onopen = function () { lastSeq = -1; };
    ws.onmessage = function (e) {
      try { apply(JSON.parse(e.data)); } catch (_) {}
    };
    ws.onclose = function () { setTimeout(connect, 1000); };
  }

  connect();
</script>
</body>
</html>
