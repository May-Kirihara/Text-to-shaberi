<!--
  Text-to-shaberi 配信字幕オーバーレイ — VTuber風 切り替わりプリセット
  ================================================================

  index.html（既定フェード式）との違い:
    - テキスト変更は瞬時（フェードなしで切替）＋切替時に軽い pop アニメ（--pop-ms: 0 で無効化）
    - 発話が終わると速やかにフェードアウトして消える（--out-ms で時間調整・0 で瞬時）
    - HOLD（下の script）を true にすると、発話が途切れても直近の行を保持（消えない）
    - 任意の背景ボックス（--box-bg に色を入れると角丸パネル表示）

  使い方:
    client.toml で [caption].template = "vtuber" を指定。
    OBS ブラウザソースの URL は http://127.0.0.1:8772/（GET / がこのプリセットを返す）

  配信ディレイ同期（遅延表示）:
    テキスト切替を一律 delay ms 後ろへずらせます（OBS のストリームディレイに合わせる用途）。
    設定は GUI の ⚙設定 →「字幕」→「配信ディレイ同期」(ms)、または URL ?delay=<ミリ秒>（URL が優先）:
        http://127.0.0.1:8772/?delay=2000
    ※ 表示の切替も消去も一律 delay ms ずれます（相対タイミングは不変）。

  CSS 変数一覧:
    --font          フォント
    --size          文字サイズ
    --color         文字色
    --stroke-color  縁取り色
    --stroke-width  縁取り太さ
    --shadow        text-shadow
    --align         水平位置 (center / left / right)
    --valign        垂直位置 (flex-end / center / flex-start)
    --max-width     字幕最大幅
    --pop-ms        切替 pop アニメ時間（0 で無効）
    --out-ms        発話終了時のフェードアウト時間（0 で瞬時に消える）
    --box-bg        背景ボックス色（transparent で非表示）
    --box-radius    背景ボックス角丸
    --box-pad       背景ボックス内余白
-->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root {
    --font: "Noto Sans JP", sans-serif;
    --size: 64px;
    --color: #ffffff;
    --stroke-color: #000000;
    --stroke-width: 6px;
    --shadow: 0 0 8px rgba(0,0,0,.8);
    --align: center;
    --valign: flex-end;
    --max-width: 90vw;
    --pop-ms: 120ms;
    --out-ms: 200ms;
    --box-bg: transparent;
    --box-radius: 12px;
    --box-pad: .15em .5em;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    height: 100%;
    align-items: var(--valign);
    justify-content: var(--align);
  }
  #cap {
    font-family: var(--font);
    font-size: var(--size);
    color: var(--color);
    -webkit-text-stroke: var(--stroke-width) var(--stroke-color);
    paint-order: stroke fill;
    text-shadow: var(--shadow);
    max-width: var(--max-width);
    line-height: 1.3;
    padding: var(--box-pad);
    background: var(--box-bg);
    border-radius: var(--box-radius);
    white-space: pre-wrap;
    word-break: break-word;
    transform: translate(0, 0);
    opacity: 1;
    transition: opacity 0s;          /* 表示は瞬時（VTuber風の即時切替を維持） */
  }
  #cap.hide {
    opacity: 0;
    transition: opacity var(--out-ms) ease;   /* 発話終了時だけフェードアウト */
  }
  @keyframes pop {
    from { transform: scale(.96) translateY(4px); opacity: .7; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }
  #cap.pop {
    animation: pop var(--pop-ms) ease-out;
  }
</style>
</head>
<body>
<div id="wrap"><div id="cap" class="hide"></div></div>
<script>
  // HOLD = true にすると、発話が途切れても直近の行を保持（消えない）。
  // 既定 false = 発話が終わると --out-ms でフェードアウトして消す。
  var HOLD = false;

  var cap = document.getElementById('cap');
  var lastSeq = -1;
  var current = '';

  // 配信ディレイ同期: テキスト切替を一律 delay ms 後ろへずらす。
  // 優先順位: URL ?delay= が明示指定なら最優先。無ければサーバ既定（UI 設定値）に追従。
  var urlDelay = (function () {
    var v = new URLSearchParams(location.search).get('delay');
    if (v === null) return null;             // 指定なし → サーバ既定(UI設定)に従う
    var n = parseInt(v, 10);
    if (!isFinite(n) || n < 0) n = 0;
    if (n > 60000) n = 60000;                // 上限 60s（暴走/タイプミス保護）
    return n;
  })();
  var srvDelay = 0;                          // サーバ(UI設定)由来の既定 delay
  function curDelay() {
    var d = (urlDelay !== null) ? urlDelay : srvDelay;
    return d > 0 ? d : 0;
  }

  var queue = [];                            // [{due, msg}] 受信順 FIFO
  var timer = null;

  function pump() {
    timer = null;
    var now = performance.now();
    while (queue.length && queue[0].due <= now) apply(queue.shift().msg);
    if (queue.length) timer = setTimeout(pump, Math.max(0, queue[0].due - performance.now()));
  }

  function enqueue(m) {
    if (urlDelay === null && typeof m.delay === 'number' && m.delay >= 0) {
      srvDelay = m.delay > 60000 ? 60000 : m.delay;  // UI 設定値を取り込む（seq に関係なく即時）
    }
    var d = curDelay();
    if (d <= 0) { apply(m); return; }        // delay 0＝従来どおり即描画（後方互換）
    // due 昇順を保って挿入（delay を短縮した時、後着が先頭より早い due でも正しく発火させる）。
    var item = { due: performance.now() + d, msg: m };
    var i = queue.length;
    while (i > 0 && queue[i - 1].due > item.due) i--;
    queue.splice(i, 0, item);
    if (i === 0 && timer !== null) { clearTimeout(timer); timer = null; }  // 先頭が変化→張り直し
    if (timer === null) pump();
  }

  function swap(text) {
    cap.textContent = text;
    cap.classList.remove('pop');
    void cap.offsetWidth;
    cap.classList.add('pop');
  }

  function apply(m) {
    if (typeof m.seq === 'number' && m.seq < lastSeq) return;
    lastSeq = m.seq ?? lastSeq;
    if (m.visible && m.text) {
      cap.classList.remove('hide');            // 表示（フェードなしで瞬時に出す）
      if (m.text !== current) {
        current = m.text;
        swap(m.text);
      }
    } else if (!HOLD) {
      // 発話終了（visible:false）/空テキスト → 速やかにフェードアウトして消す
      cap.classList.add('hide');
      current = '';                            // 次発話で同テキストでも確実に再表示＆pop
    }
  }

  function connect() {
    var url = (location.protocol === 'https:' ? 'wss://' : 'ws://')
      + location.host + '/ws' + location.search;
    var ws = new WebSocket(url);
    ws.onopen = function () {                 // 再接続: 旧接続の未描画イベントを捨て _cur 再送で再同期
      queue.length = 0;
      if (timer !== null) { clearTimeout(timer); timer = null; }
      lastSeq = -1;
    };
    ws.onmessage = function (e) {
      try { enqueue(JSON.parse(e.data)); } catch (_) {}
    };
    ws.onclose = function () { setTimeout(connect, 1000); };
  }

  connect();
</script>
</body>
</html>
